<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./scss/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <header>
      <img src="./images/logo.svg" alt="Splitter" />
    </header>
    <main>
      <article>
        <div class="input-group">
          <label for="bill">Bill</label>
          <input type="number" placeholder="0" />
        </div>
        <div class="input-group">
          <label for="tip">Select Tip %</label>
          <div class="button-group">
            <button class="tip-input" type="button" value="5">5%</button>
            <button class="tip-input" type="button" value="10">10%</button>
            <button class="tip-input active" type="button" value="15">15%</button>
            <button class="tip-input" type="button" value="25">25%</button>
            <button class="tip-input" type="button" value="50">50%</button>
            <input
              class="custom"
              placeholder="Custom"
              type="number"
              name="custom"
              id="custom-tip"
              value="Custom"
            />
          </div>
        </div>
        <div class="input-group">
          <label for="people">Number of People</label>
          <input type="number" placeholder="0" />
        </div>
        <!-- <div class="result-group">
          <div class="result-row">
            <p>Tip Amount<br /><small>/ person</small></p>
          </div>
          <div class="result-row">
            <p>Total<br /><small>/ person</small></p>
          </div>
          <button type="reset">Reset</button>
        </div> -->
      </article>
    </main>
  </body>
</html>

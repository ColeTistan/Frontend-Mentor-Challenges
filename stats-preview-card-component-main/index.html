<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/scss/style.css" />

    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main>
      <div class="card">
          <img src="./images/image-header-desktop.jpg" alt="image header" />
        <div class="card-main">
          <p class="card-header">
            Get <span>insights</span> that help your business grow.
          </p>
          <p class="card-description">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
          <div class="stats">
            <div class="stats-section">
              <p class="stats-number">10k+</p>
              <p class="stats-header">companies</p>
            </div>
            <div class="stats-section">
              <p class="stats-number">314</p>
              <p class="stats-header">templates</p>
            </div>
            <div class="stats-section">
              <p class="stats-number">12m+</p>
              <p class="stats-header">queries</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

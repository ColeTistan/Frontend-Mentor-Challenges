<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1"
    />
    <link rel="stylesheet" href="./scss/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Intro component with sign up form</title>
  </head>
  <body>
    <main>
      <section class="main-info-section">
        <h1>Learn to code by watching others</h1>
        <p>
          See how experienced developers solve problems in real-time. Watching
          scripted tutorials is great, but understanding how developers think is
          invaluable.
        </p>
      </section>
      <section class="form-section">
        <div class="subscription-banner">
          <p><span>Try it free 7 days</span> then $20/mo. thereafter</p>
        </div>
        <form>
          <div class="input-group">
            <input class="user-input" id="first-name" placeholder="First Name" type="text" />
          </div>
          <div class="input-group">
            <input class="user-input" id="last-name" placeholder="Last Name" type="text" />
          </div>
          <div class="input-group">
            <input class="user-input" id="email-address" placeholder="Email Address" type="email" />
          </div>
          <div class="input-group">
            <input class="user-input" id="password" name="password" placeholder="Password" type="password" />
          </div>
          <button type="submit">Claim your free trial</button>
          <small>
            By clicking the button, you are agreeing to our
            <a href="#">Terms and Services</a>
          </small>
        </form>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <section class="grid-container">
        <article class="grid-item user">
          Report for Jeremy Robson Daily Weekly Monthly

          Previous - 7hrs

          32hrs
          <!-- weekly -->
          Previous - 36hrs
          <!-- weekly -->
          103hrs
          <!-- monthly -->
          Previous - 128hrs
          <!-- monthly -->
        </article>
        <article class="grid-item play"><div>work</div></article>
        <article class="grid-item study"><div>study</div></article>
        <article class="grid-item exercise"><div>exercise</div></article>
        <article class="grid-item social"><div>social</div></article>
        <article class="grid-item self-care"><div>self-care</div></article>
      </section>
    </main>
  </body>
  <script src="app.js"></script>
</html>

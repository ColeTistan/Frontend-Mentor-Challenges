<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <section class="grid-container">
        <article class="grid-item user">
          <div class="user-section">
            <img class="card-img" src="./images/image-jeremy.png" alt="Jeremy" />
            <div class="user-detail">
              <p class="faded-font">Report for</p>
              <p class="heading">Jeremy Robson</p>
            </div>
          </div>
          <div class="detail-section">
            <ul>
              <li><button>Daily</button></li>
              <li><button>Weekly</button></li>
              <li><button>Monthly</button></li>
            </ul>
          </div>
        </article>
        <article class="grid-item tracking-card work">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Work</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">8hrs</p>
              <p class="faded-font">Last Week - 9hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item tracking-card play">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Play</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">2hrs</p>
              <p class="faded-font">Last Week - 1hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item tracking-card study">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Study</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">3hrs</p>
              <p class="faded-font">Last Week - 2hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item tracking-card exercise">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Exercise</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">6hrs</p>
              <p class="faded-font">Last Week - 7hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item tracking-card social">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Social</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">4hrs</p>
              <p class="faded-font">Last Week - 3hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item tracking-card self-care">
          <div class="card-section">
            <div class="card-top-section">
              <p class="card-title">Self Care</p>
              <a href="#"
                ><img class="card-img" src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">5hrs</p>
              <p class="faded-font">Last Week - 4hrs</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
  <script src="app.js"></script>
</html>

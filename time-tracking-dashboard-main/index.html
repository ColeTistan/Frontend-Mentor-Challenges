<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <section class="grid-container">
        <article class="grid-item user">
          <div class="user-section">
            <img src="./images/image-jeremy.png" alt="Jeremy" />
            <p class="faded-font">Report for</p>
            <p class="heading">Jeremy <br />Robson</p>
          </div>
          <div class="detail-section">
            <ul>
              <li><button>Daily</button></li>
              <li><button class="active">Weekly</button></li>
              <li><button>Monthly</button></li>
            </ul>
          </div>
        </article>
        <article class="grid-item work">
          <div class="card-section">
            <div class="card-top-section">
              <p>Work</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item play">
          <div class="card-section">
            <div class="card-top-section">
              <p>Play</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item study">
          <div class="card-section">
            <div class="card-top-section">
              <p>Study</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item exercise">
          <div class="card-section">
            <div class="card-top-section">
              <p>Exercise</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item social">
          <div class="card-section">
            <div class="card-top-section">
              <p>Social</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
        <article class="grid-item self-care">
          <div class="card-section">
            <div class="card-top-section">
              <p>Self Care</p>
              <a href="#"
                ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
              /></a>
            </div>
            <div class="card-bottom-section">
              <p class="heading-secondary">32hrs</p>
              <p class="faded-font">Last Week &hyphen; 36hrs</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
  <script src="app.js"></script>
</html>

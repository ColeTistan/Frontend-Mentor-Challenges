<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./scss/style.css" />
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <div class="card card-primary">
        <div class="profile-section">
          <div class="profile-img">
            <img src="./images/image-jeremy.png" alt="profile img" />
          </div>
          <div class="profile-body">
            <p>Report for<br /><span>Jeremy Robson</span></p>
          </div>
        </div>
        <div class="toggle-menu">
          <ul class="toggle-list">
            <li class="toggle-item">
              <button type="submit" class="toggle-btn">Daily</button>
            </li>
            <li class="toggle-item">
              <button type="submit" class="toggle-btn">Weekly</button>
            </li>
            <li class="toggle-item">
              <button type="submit" class="toggle-btn">Monthly</button>
            </li>
          </ul>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="current-time">32hrs</p>
            <p class="previous-time">Last Week &hyphen; 36hrs</p>
          </div>
          <div class="card-top">
            <p class="card-title">Work</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="workout-time">10hrs</p>
            <p class="previous-time">Last Week &hyphen; 8hrs</p>
          </div>
          <div class="card-top">
            <p>Play</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="workout-time">4hrs</p>
            <p class="previous-time">Last Week &hyphen; 7hrs</p>
          </div>
          <div class="card-top">
            <p>Study</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="workout-time">4hrs</p>
            <p class="previous-time">Last Week &hyphen; 5hrs</p>
          </div>
          <div class="card-top">
            <p>Exercise</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="workout-time">5hrs</p>
            <p class="previous-time">Last Week &hyphen; 10hrs</p>
          </div>
          <div class="card-top">
            <p>Social</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
      <div class="card card-secondary">
        <div class="background-section"></div>
        <div class="card-body">
          <div class="card-details">
            <p class="workout-time">2hrs</p>
            <p class="previous-time">Last Week &hyphen; 2hrs</p>
          </div>
          <div class="card-top">
            <p>Self Care</p>
            <a href="#" class="nav-link"
              ><img src="./images/icon-ellipsis.svg" alt="ellipsis"
            /></a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
